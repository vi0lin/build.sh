# ===========================================================================
# build.sh.conf.beispiel -- Vorlage. Als "build.sh.conf" in den STAMMORDNER
# des Projekts kopieren und anpassen. Ersetzt den frueheren Ordner config/.
#
# Jeder Abschnitt behaelt das Format der frueheren Datei:
#   [hosts]     Tabelle:  name | os | benutzer@host | pfad | passwort | git-url |
#   [targets]   Bash:     CONF_CMD[ziel]='...' BUILD_CMD RUN_CMD PUBLISH_CMD DOWNLOAD
#   [release]   Bash:     RELEASE_GIT_URL="..." RELEASE_NOTES="..."
#   [packages]  paketmanager::werkzeug = paketname
#   [exclude]   Muster wie .gitignore
# Kommentare beginnen mit #. Abschnittsnamen sind gross/klein egal.
# ===========================================================================

[hosts]
# name | os (posix|cmd|wsl) | benutzer@host | pfad auf dem host | passwort (leer = ssh-schluessel) | git-url |
# Github Path is the repo, for the pull on the build targets@host
local       | posix   |                        |                               |          |     |
windows     | cmd     | win@192.168.0.200 | C:/Users/win/Desktop/project  | password | https://github.com/vi0lin/project.git |
wsl         | wsl     | win@192.168.0.200 | /home/win/Desktop/project | password | https://github.com/vi0lin/project.git |
linux       | posix   | user@linux | /home/user/project          |          | https://github.com/vi0lin/project.git |
buildserver | posix   | server@192.168.0.160  | /home/server/project               |          | https://github.com/vi0lin/project.git |

[targets]
declare -A CONF_CMD BUILD_CMD REQUIRE RUN_CMD PUBLISH_CMD INSTALL_CMD DOWNLOAD

# VORLAGE -- ins config/ des eigenen Projekts kopieren und anpassen.
# build.sh liest config/ immer aus dem PROJEKTORDNER (Arbeitsverzeichnis),
# nicht aus diesem Werkzeug-Repository.
#
# RELEASE-NAME = NAME DES BAUORDNERS.
#   publish_release.sh builds/deb   veroeffentlicht als "deb" -- die App muss
#   unter demselben Namen in release.json suchen (im Beispielprojekt baut
#   CMake den Ordnernamen als XBM_RELEASE_NAME ein). Ein eigenes
#   RELEASE_NAME[] gibt es nicht mehr. Anderer Name:
#       publish_release.sh <name> builds/<ordner>
#
# publish_release.sh steht OHNE ./ -- build.sh legt seinen eigenen Ordner
# vorne in den PATH und bringt das Skript auch auf die anderen Hosts.

CONF_CMD[deb]='cmake -B builds/deb -S . -G Ninja -DCMAKE_BUILD_TYPE=Release'
BUILD_CMD[deb]='cmake --build builds/deb -j ${JOBS}'
RUN_CMD[deb]='./builds/deb/x_bookmark_manager'
PUBLISH_CMD[deb]='publish_release.sh builds/deb'
DOWNLOAD[deb]='builds/deb/x_bookmark_manager'

CONF_CMD[deb-asan]='cmake -B builds/deb-asan -S . -G Ninja -DXBM_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug'
BUILD_CMD[deb-asan]='cmake --build builds/deb-asan'
RUN_CMD[deb-asan]='ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 ./builds/deb-asan/x_bookmark_manager'
PUBLISH_CMD[deb-asan]='publish_release.sh builds/deb-asan'
DOWNLOAD[deb-asan]='builds/deb-asan/x_bookmark_manager'

CONF_CMD[exe]='cmake -B builds/exe -S . -G Ninja -DCMAKE_BUILD_TYPE=Release'
BUILD_CMD[exe]='cmake --build builds/exe -j ${JOBS}'
RUN_CMD[exe]='./builds/exe/x_bookmark_manager.exe'
PUBLISH_CMD[exe]='publish_release.sh builds/exe'
DOWNLOAD[exe]='builds/exe/x_bookmark_manager.exe'

# APK: wie alle anderen unter builds/<ziel>/.
CONF_CMD[apk]='true'
BUILD_CMD[apk]='./build_apk.sh'
# install -r ersetzt die App und BEHAELT ihre Daten. NIE "adb uninstall"
# davorsetzen: Deinstallieren loescht auf Android alle App-Daten.
RUN_CMD[apk@windows]='cd /mnt/c/Users/win/Desktop/project && adb.exe install -r ./builds/apk/x_bookmark_manager.apk && adb.exe shell am start -n com.example.app/.MainActivity'
PUBLISH_CMD[apk]='publish_release.sh builds/apk'
DOWNLOAD[apk]='builds/apk/x_bookmark_manager.apk'

[release]
# Vorlage -- ins config/ des Projekts kopieren.
# Git-Repository, in das publish_release.sh die Pakete und release.json pusht.
RELEASE_GIT_URL="https://github.com/vi0lin/releases.git"
# Kurzbeschreibung, erscheint als "notes" in release.json (optional).
RELEASE_NOTES=""

[packages]
# Approach To Multiplattform Compability
winget::adb = Google.PlatformTools
apt::adb    = android-tools-adb

winget::zip = 7zip.7zip
apt::zip    = zip

[exclude]
# Exclude all build paths
builds/
# But dont exclude the produced binary files (so buildfiles will not get synchronized reducing overhead)
!builds/*/x_bookmark_manager*

# Exclude external/
external/
# But dont exclude the submodule external/pdf 
!external/pdf/
# But build-windows will be excluded in the submodule
external/pdf/build-windows/
